## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Sat Mar 12 05:53:50 MSK 2016
APP_VERSION_CODE=4928
APP_VERSION_NAME=0.1.0
# T56b: Hermes standalone identity. This is the INSTALLED package id (applicationId);
# the code namespace stays org.telegram.messenger — all res/xml + Java literals
# (accountType, SHORTCUT_SHARE, custom actions) are namespace-scoped and stay matched.
APP_PACKAGE=com.hermes.chat
# T35: single, consistent daemon memory policy for every invocation (the
# workflow used to override this per-step, forking differently-configured
# daemons). MaxPermSize is a Java 7 flag - dead weight on the pinned JDK 11;
# MaxMetaspaceSize is the correct knob. Heap dump on OOM for post-mortems.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
# T8-CI: persist task outputs (javac/aapt2/dex) so repeated CI builds restore
# unchanged work from the build cache instead of re-executing it. The cache
# directory (~/.gradle/caches/build-cache-1) is carried across runs by the
# dedicated rolling cache step in .github/workflows/build.yml.
org.gradle.caching=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
# T49: compileSdk 34 on AGP 7.4.2 (Play-compliant targetSdk 34 toolchain).
# AGP 8.x/35 requires a JDK 17 + namespace + edge-to-edge migration — see report.
android.suppressUnsupportedCompileSdk=34
