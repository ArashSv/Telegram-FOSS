name: Ops Field Evidence (T77)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ops-field-evidence.yml'

concurrency:
  group: ops-field-evidence
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEB: ${{ secrets.WEBDAV_URL }}
      AUTH: ${{ secrets.WEBDAV_AUTH }}
      SITE: ${{ secrets.SITE_URL }}
      DIAG: ${{ secrets.DIAG_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Filesystem truth map (PROPFIND)
        run: |
          set +e
          for p in "/public_html/" "/public_html/tele/" "/tele/"; do
            echo "== PROPFIND $p"
            code=$(curl -sS -k -m 60 -u "$AUTH" -X PROPFIND -H "Depth: 1" -o /tmp/pf2.xml -w "%{http_code}" "$WEB$p")
            echo "status=$code"
            grep -oE "<[a-zA-Z0-9]*:?href>[^<]+<" /tmp/pf2.xml | sed -E "s/<[^>]*>//g" | head -30
          done

      - name: Hygiene - remove stale T66/T76 probes
        run: |
          set +e
          for f in _xo_t76a.php _xo_t76b.php _xo_t76v_out_723adb0f45.json _xo_t66_out.json; do
            curl -sS -k -m 60 -u "$AUTH" -X DELETE "$WEB/public_html/tele/$f" -o /dev/null -w "del $f -> %{http_code}\n"
          done

      - name: Deploy + run field-evidence probe
        run: |
          set +e
          sed "s/__TOKEN__/$DIAG/" scripts/t77tmp/_xo_t77ev.php > /tmp/_xo_t77ev.php || \
          sed "s/__TOKEN__/$DIAG/" _xo_t77ev.php > /tmp/_xo_t77ev.php
          php -l /tmp/_xo_t77ev.php 2>/dev/null || true
          ok=0
          for i in 1 2 3 4; do
            curl -sS -k -m 60 -u "$AUTH" -X DELETE "$WEB/public_html/tele/$RUNAME" -o /dev/null
            code=$(curl -sS -k -m 120 -u "$AUTH" -T /tmp/_xo_t77ev.php "$WEB/public_html/tele/_xo_t77ev.php" -o /dev/null -w "%{http_code}")
            echo "PUT try$i -> $code"
            case "$code" in 2*) ok=1; break;; esac
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "deploy failed"; exit 1; }
          for i in 1 2 3 4 5; do
            code=$(curl -4 -sS --http1.1 -m 90 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" -o /tmp/ev.json -w "%{http_code}" "$SITE/$RUNAME?t=$DIAG&r=$(date +%s%N)")
            echo "RUN try$i -> $code bytes=$(wc -c < /tmp/ev.json)"
            if [ "$code" = 200 ] && grep -q '"users"' /tmp/ev.json 2>/dev/null; then break; fi
            sleep 8
          done
          echo "================ EVIDENCE ================"
          cat /tmp/ev.json
          echo "================ progress trace ================"
          curl -sS -k -m 60 -u "$AUTH" "$WEB/public_html/tele/_prog_${RUNAME}.txt" -w "\nprog -> %{http_code}\n" || true
          echo "================ cleanup ================"
          curl -sS -k -m 60 -u "$AUTH" -X DELETE "$WEB/public_html/tele/$RUNAME" -o /dev/null -w "cleanup -> %{http_code}\n"
