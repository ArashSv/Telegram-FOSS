name: Ops Field Evidence (T77)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ops-field-evidence.yml'

concurrency:
  group: ops-field-evidence
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEB: ${{ secrets.WEBDAV_URL }}
      AUTH: ${{ secrets.WEBDAV_AUTH }}
      SITE: ${{ secrets.SITE_URL }}
      DIAG: ${{ secrets.DIAG_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Filesystem truth map (PROPFIND)
        run: |
          set +e
          for p in "/public_html/" "/public_html/tele/" "/tele/"; do
            echo "== PROPFIND $p"
            curl -sS -k -m 60 -u "$AUTH" -X PROPFIND -H "Depth: 1" -o /tmp/pf2.xml -w "status=%{http_code}\n" "$WEB$p"
            python3 - <<'PY'
            import re
            src = open('/tmp/pf2.xml', errors='replace').read()
            hrefs = re.findall(r'<(?:[a-zA-Z0-9]+:)?href>([^<]+)<', src)
            for h in hrefs[:30]:
                print('   ', h)
            PY
          done

      - name: Deploy + run field-evidence probe
        run: |
          set +e
          sed "s/__TOKEN__/$DIAG/" scripts/t77tmp/xo_t77ev.php > /tmp/xo_t77ev.php || \
          sed "s/__TOKEN__/$DIAG/" xo_t77ev.php > /tmp/xo_t77ev.php
          php -l /tmp/xo_t77ev.php 2>/dev/null || true
          ok=0
          for i in 1 2 3 4; do
            curl -sS -k -m 60 -u "$AUTH" -X DELETE "$WEB/public_html/tele/xo_t77ev.php" -o /dev/null
            code=$(curl -sS -k -m 120 -u "$AUTH" -T /tmp/xo_t77ev.php "$WEB/public_html/tele/xo_t77ev.php" -o /dev/null -w "%{http_code}")
            echo "PUT try$i -> $code"
            case "$code" in 2*) ok=1; break;; esac
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "deploy failed"; exit 1; }
          for i in 1 2 3 4 5; do
            code=$(curl -4 -sS --http1.1 -m 90 -o /tmp/ev.json -w "%{http_code}" "$SITE/xo_t77ev.php?t=$DIAG")
            echo "RUN try$i -> $code bytes=$(wc -c < /tmp/ev.json)"
            if [ "$code" = 200 ] && grep -q '"users"' /tmp/ev.json 2>/dev/null; then break; fi
            sleep 8
          done
          echo "================ EVIDENCE ================"
          cat /tmp/ev.json
          echo "================ cleanup ================"
          curl -sS -k -m 60 -u "$AUTH" -X DELETE "$WEB/public_html/tele/xo_t77ev.php" -o /dev/null -w "cleanup -> %{http_code}\n"
