name: Ops T84 Panel Verify (admin panel)

on:
  workflow_dispatch: {}

jobs:
  panel-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Admin-panel end-to-end on the LIVE backend
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            if python3 ops/t84/panel_e2e.py; then ok=1; break; fi
            echo "panel e2e attempt $i failed; retrying"
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "PANEL E2E FAILED after 5 attempts"; exit 1; }

# re-register nudge
