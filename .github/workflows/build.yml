name: Build APK

# Telegram-FOSS specific CI (fork base pins: Gradle 7.6.4 / AGP 7.4.2 / JDK 11 /
# compileSdk 34 / buildTools 34.0.0 / NDK 21.4.7075529 / cmake 3.10.2).
# Do NOT reuse generic Telegram-Android (DrKLO) workflows here.
#
# ── T35 reliability redesign (why the steps are ordered the way they are) ──
#
# Runs #37/#39/#40 all burned a FULL ~35-minute native build (libvpx+ffmpeg+
# boringssl) only to fail in the last minute on a Java compile error, and #40
# additionally lost one attempt to a runner shutdown ("received a shutdown
# signal") that had nothing to do with the code. Root-cause fixes, in order:
#
#  1. FAST-FAIL JAVA GATE — compile :TMessagesProj_App:compileAfatDebugJavaWithJavac
#     (app + library module Java) BEFORE the native prebuilt builds. javac does
#     not depend on the native tasks, so a Java error now fails the run in
#     ~5 minutes instead of ~40. (Also enforced locally by the preflight audit
#     battery — CI is the second gate, not the only one.)
#
#  2. NATIVE PREBUILTS CACHE — the libvpx/ffmpeg/boringssl outputs depend ONLY
#     on (a) the three build scripts + two patch scripts + the patch files and
#     (b) the checked-out submodule SHAs. Both are hashed into the cache key,
#     so unchanged toolchain sources skip the entire native build. The cached
#     paths include boringssl/include/openssl/aes.h because patch_boringssl.sh
#     MODIFIES that tracked header (adds AES_ige_encrypt) and the app-level
#     CMake compiles jni.c against it — a pristine checkout on a cache hit
#     would break the C build without it.
#
#  3. INFRA-FLAKE AUTO-RETRY — a `retry` job re-runs the failed build job via
#     `gh run rerun --failed` (max 2 attempts total). Catches runner shutdowns
#     / spot evictions that javac can never prevent.
#
#  4. ONE DAEMON POLICY — the JVM memory policy lives ONLY in
#     gradle.properties (the per-step -Dorg.gradle.jvmargs override used to
#     fork a second, differently-configured daemon per invocation).
#
# github.token needs contents:write for Releases and actions:write for the
# self-rerun retry job.
permissions:
  contents: write
  actions: write

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      abi:
        description: 'ABI set to build (push builds are ALWAYS universal)'
        required: false
        default: 'all'
        type: choice
        options: [all, arm64]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── T63 unit-test gate ───────────────────────────────────────────────────
  # JVM contract tests (src/test) BEFORE any native work: the JSON fixtures
  # under TMessagesProj/src/test/resources are REAL backend outputs frozen by
  # the backend test bed, so a wire change (client mapper drift OR backend
  # contract change) fails the run in minutes. The APK build below refuses to
  # start unless this is green. No native compilation here — javac + JUnit only.
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 11 (same toolchain pin as the build job)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Install pinned NDK 21.4.7075529 (AGP configuration needs it present)
        run: |
          export JAVA_HOME="${JAVA_HOME_21_X64:-${JAVA_HOME_17_X64:-$JAVA_HOME}}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;21.4.7075529" > /dev/null

      - name: "Run JVM contract tests (TlJsonMapper / envelope / privacy wire / router / specials)"
        run: |
          ./gradlew :TMessagesProj:testDebugUnitTest \
            --build-cache \
            --stacktrace \
            --continue

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: TMessagesProj/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  build:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    # T64: universal 4-ABI native build (libvpx/ffmpeg/boringssl x4) needs the
    # extra headroom on the first (cache-miss) run; later runs ride the cache.
    timeout-minutes: 180
    steps:
      - name: "Checkout (recursive submodules: ffmpeg, boringssl, libvpx, libwebp)"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 11 (Gradle 7.6.4 / AGP 7.4.2 requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      # T8-CI root-cause fix for 35-40 min builds: the dependency cache above
      # (setup-java) uses a STATIC key hashed from the build files, and
      # actions/cache never overwrites an existing key - so a build cache that
      # rode along there would be frozen at whatever existed on first save
      # (empty). This SEPARATE rolling key always misses -> always re-saves the
      # latest execution cache (javac/aapt2/dex task outputs). Gradle keys
      # every cache entry by content hash, so stale entries are inert.
      - name: Restore Gradle build cache (rolling execution cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/transforms-3
          key: gradle-buildcache-${{ github.run_id }}
          restore-keys: |
            gradle-buildcache-

      - name: Compute native prebuilts cache key (submodule SHAs + build/patch scripts)
        id: natkey
        run: |
          SUBS=$(git submodule status | awk '{print $1"="$2}' | sort | sha256sum | cut -d' ' -f1 | cut -c1-16)
          SCRIPTS=$(cat TMessagesProj/jni/build_libvpx_clang.sh \
                        TMessagesProj/jni/build_ffmpeg_clang.sh \
                        TMessagesProj/jni/build_boringssl.sh \
                        TMessagesProj/jni/patch_ffmpeg.sh \
                        TMessagesProj/jni/patch_boringssl.sh \
                        TMessagesProj/jni/patches/ffmpeg/*.patch \
                        TMessagesProj/jni/patches/boringssl/*.patch 2>/dev/null | sha256sum | cut -d' ' -f1 | cut -c1-16)
          # T64: key covers ALL four ABIs now (universal APK covers 32-bit
          # phones — arm64-only APKs are rejected by them with 'App not installed').
          echo "key=native-all-${SUBS}-${SCRIPTS}" >> "$GITHUB_OUTPUT"
          echo "native cache key: native-all-${SUBS}-${SCRIPTS}"

      # Restored AFTER checkout (overlays the submodule dirs). A hit means the
      # exact same sources + scripts produced these artifacts on a prior run.
      - name: Restore native prebuilts (libvpx/ffmpeg/boringssl outputs)
        id: nativecache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/jni/libvpx/build
            TMessagesProj/jni/ffmpeg/build
            TMessagesProj/jni/boringssl/build
            TMessagesProj/jni/boringssl/include/openssl/aes.h
          key: ${{ steps.natkey.outputs.key }}

      - name: Free runner disk (preinstalled NDKs are useless for our pin)
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/ndk-bundle"
          echo "After:"; df -h / | tail -1

      - name: Install pinned NDK 21.4.7075529
        run: |
          # sdkmanager needs Java 17+, but build needs JDK 11 - use runner JVM for sdkmanager only
          export JAVA_HOME="${JAVA_HOME_21_X64:-${JAVA_HOME_17_X64:-$JAVA_HOME}}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;21.4.7075529" > /dev/null

      # ── T35 fast-fail gate ────────────────────────────────────────────────
      # Compiles ALL Java (library + app module) with the real classpath.
      # Depends on NO native task, so it runs before the (possibly 30-minute)
      # prebuilt builds. Every javac regression in #36/#37/#39/#40 would have
      # died HERE in minutes. The full assemble below reuses the outputs via
      # the build cache — the gate is nearly free.
      - name: "Fast-fail Java gate (compile app+library, no native)"
        run: |
          # T53 (task 6): the gate now compiles the RELEASE variant — the
          # variant that ships (release additionally exercises the
          # signing-config wiring).
          ./gradlew :TMessagesProj_App:compileAfatReleaseJavaWithJavac \
            --build-cache \
            --stacktrace

      # API_KEYS is intentionally NOT written here anymore (T1): gradle now
      # falls back to inert placeholders when the file is absent, so CI builds
      # exercise the exact fresh-clone configuration path.

      # T64: arm64-only is now the OPT-IN path (manual dispatch only). Push
      # builds ship UNIVERSAL APKs — every ABI the flavor declares — because a
      # 32-bit phone receiving an arm64-only APK fails with 'App not installed'.
      - name: ABI filter to arm64-v8a (CI-only transform, never committed)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.abi == 'arm64' }}
        run: |
          sed -i 's/abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"/abiFilters "arm64-v8a"/' TMessagesProj_App/build.gradle
          # Library module has no abiFilters of its own -> AGP builds ALL ABIs there.
          # Inject arm64-only filter after the unique APP_HASH anchor in defaultConfig.
          sed -i "s/buildConfigField 'String', 'APP_HASH', getAppHash()/buildConfigField 'String', 'APP_HASH', getAppHash()\n\n        ndk { abiFilters \"arm64-v8a\" }/" TMessagesProj/build.gradle
          echo "app module:"; grep -c 'abiFilters "arm64-v8a"' TMessagesProj_App/build.gradle
          echo "lib module:"; grep -c 'abiFilters "arm64-v8a"' TMessagesProj/build.gradle

      - name: "Build native prebuilts (libvpx, ffmpeg, boringssl — ALL ABIs on universal builds)"
        if: steps.nativecache.outputs.cache-hit != 'true'
        run: |
          # Per upstream README: NDK + Ninja required; order matters.
          # T64: yasm+nasm are required by libvpx/ffmpeg x86-family asm — the
          # arm64-only era never needed them; universal builds do.
          sudo apt-get install -y ninja-build yasm nasm > /dev/null
          export NDK="$ANDROID_HOME/ndk/21.4.7075529"
          export NINJA_PATH="$(which ninja)"
          cd TMessagesProj/jni
          # T64: build ALL four ABIs. Each script loops over its args; the two
          # patch scripts patch SOURCES and must run exactly ONCE — patch_ffmpeg
          # then distributes headers into every ABI build dir (it already
          # expects all four: arm64-v8a/armeabi-v7a/x86/x86_64).
          ./build_libvpx_clang.sh arm arm64 x86 x86_64
          ./build_ffmpeg_clang.sh arm arm64 x86 x86_64
          ./patch_ffmpeg.sh
          ./patch_boringssl.sh
          ./build_boringssl.sh arm arm64 x86 x86_64

      - name: Build assembleAfatRelease (signed, non-debuggable)
        env:
          RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/hermes-release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # T53 (task 6): exit DEBUG mode — CI now ships the signed RELEASE
          # build (debuggable=false, DEBUG_VERSION=false, LOGS_ENABLED=false
          # via BuildConfig). The keystore rides the repo secrets as base64.
          if [ -z "$RELEASE_STORE_PASSWORD" ]; then
            echo "RELEASE signing secrets missing — refusing to build an unsigned 'release'" >&2
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > hermes-release.keystore
          test -s hermes-release.keystore
          # --build-cache: explicit twin of org.gradle.caching=true (gradle.properties).
          # Memory policy comes from gradle.properties (single daemon config).
          # T64: MONOTONIC versioning — versionCode was frozen at 4928*10+9=49289
          # across every build, so Android could not order two installed builds.
          # Now: versionCode = (5000 + run_number)*10 + 9 (always > history,
          # always increasing), versionName = 0.1.0-<run_number> (visible in
          # Settings; -P overrides gradle.properties fallback for local builds).
          BUILD_NUM=$((5000 + GITHUB_RUN_NUMBER))
          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            -PAPP_VERSION_CODE="$BUILD_NUM" \
            -PAPP_VERSION_NAME="0.1.0-${GITHUB_RUN_NUMBER}" \
            --build-cache \
            --stacktrace

      - name: Verify the APK is a real release build (not debuggable)
        run: |
          APK="$(ls TMessagesProj_App/build/outputs/apk/afat/release/*.apk | head -n 1)"
          echo "checking: $APK"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort | tail -n 1)
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/manifest.txt
          grep -E 'android:debuggable|android:versionName|android:targetSdkVersion' /tmp/manifest.txt || true
          # aapt2 encodes boolean true as 0xffffffff and false as 0x0
          if grep "android:debuggable" /tmp/manifest.txt | grep -q "0xffffffff"; then
            echo "FATAL: the release APK is debuggable" >&2; exit 1
          fi
          echo "OK: manifest has no debuggable=true flag"

      # ── T64 install-failure guards: the exact 'App not installed' killers ──
      # 1) v1+v2 signature present (v2 is MANDATORY on Android 11+ for
      #    targetSdk>=30; Android 14 rejects v1-only outright).
      # 2) cert pinned to the T53 Hermes release key (catches accidental
      #    secret rotation that would orphan every existing install).
      # 3) ABI coverage (missing armeabi-v7a = every 32-bit phone refuses).
      # 4) versionCode is the expected monotonic value.
      - name: "T64 gate: signature schemes + cert pin + ABI coverage + versionCode"
        run: |
          APK="$(ls TMessagesProj_App/build/outputs/apk/afat/release/*.apk | head -n 1)"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n 1)"
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort | tail -n 1)"
          echo "== apksigner verify (verbose)"
          "$APKSIGNER" verify --verbose "$APK" > /tmp/sigverify.txt || { cat /tmp/sigverify.txt; exit 1; }
          cat /tmp/sigverify.txt
          grep -E "Verified using v2 scheme" /tmp/sigverify.txt | grep -q ": true" || { echo "FATAL: v2 signature missing — Android 11+ would refuse this APK ('App not installed')" >&2; exit 1; }
          grep -E "Verified using v1 scheme" /tmp/sigverify.txt | grep -q ": true" || { echo "FATAL: v1 signature missing — needed by Android < 7 loaders (minSdk 19)" >&2; exit 1; }
          echo "== cert pin (Hermes T53 release key)"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt | grep -i "certificate SHA-256" || { echo "FATAL: could not read signer cert" >&2; exit 1; }
          grep -qi "5453b3f837b61e1cce6c9d61a5749fc33ae950718d2b5fcffb4757f58d297fe7" /tmp/certs.txt || { echo "FATAL: signer cert is NOT the pinned Hermes release key — installs over existing builds would break" >&2; exit 1; }
          echo "== ABI coverage"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.abi }}" = "arm64" ]; then
            REQUIRED_ABIS="arm64-v8a"
          else
            REQUIRED_ABIS="armeabi-v7a arm64-v8a x86 x86_64"
          fi
          for ABI in $REQUIRED_ABIS; do
            unzip -l "$APK" | grep -q "lib/$ABI/" || { echo "FATAL: missing lib/$ABI — 32-bit/ABI-mismatched phones would show 'App not installed'" >&2; exit 1; }
          done
          echo "ABI coverage OK: $REQUIRED_ABIS"
          echo "== versionCode monotonic"
          "$AAPT2" dump badging "$APK" | head -n 1
          EXPECTED_VC=$(( (5000 + GITHUB_RUN_NUMBER) * 10 + 9 ))
          "$AAPT2" dump badging "$APK" | grep -o "versionCode='[0-9]*'" | grep -q "versionCode='$EXPECTED_VC'" || { echo "FATAL: versionCode != $EXPECTED_VC (monotonic scheme broken)" >&2; exit 1; }
          echo "T64 gate: ALL GREEN"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Stage APK for release (rename + sha256)
        if: success()
        run: |
          mkdir -p release
          APK="$(ls TMessagesProj_App/build/outputs/apk/afat/release/*.apk | head -n 1)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.abi }}" = "arm64" ]; then
            VARIANT="arm64"
          else
            VARIANT="universal"
          fi
          cp "$APK" "release/Hermes-release-${VARIANT}-build-${GITHUB_RUN_NUMBER}.apk"
          sha256sum release/Hermes-*.apk > release/SHA256SUMS.txt

      - name: Publish APK to GitHub Releases (installable build for testing)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          NOTES="Automated RELEASE build of develop @ ${GITHUB_SHA::7} (afat/release, UNIVERSAL — arm64-v8a + armeabi-v7a + x86_64 + x86, signed v1+v2+v3 with the Hermes release key, non-debuggable, targetSdk 34, monotonic versionCode). Installs on 32-bit and 64-bit phones alike. Install: download APK, allow unknown sources, install. sha256 in SHA256SUMS.txt."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "Hermes release ${GITHUB_RUN_NUMBER} (arm64-v8a, installable)" \
              --notes "$NOTES" \
              --prerelease \
              -R "$GITHUB_REPOSITORY"
          fi

  # ── T35 infra-flake guard ────────────────────────────────────────────────
  # Run#40 lost its first attempt to a runner shutdown signal (infra), not
  # code. This job re-runs the failed build job up to twice (run_attempt < 3)
  # so transient runner deaths self-heal without a human watching the queue.
  retry:
    needs: [build]
    if: failure() && github.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Re-run the failed build job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Build job failed (attempt ${{ github.run_attempt }}) — re-running failed jobs"
          gh run rerun ${{ github.run_id }} --failed -R "$GITHUB_REPOSITORY"
