apply plugin: 'com.android.application'

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    implementation 'androidx.multidex:multidex:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'
}

android {
    // T65 migration: namespace replaces the manifest package attribute.
    // BuildConfig stays org.telegram.messenger.regular (ApplicationLoaderImpl
    // imports it unchanged).
    namespace 'org.telegram.messenger.regular'
    compileSdk 35

    defaultConfig.applicationId = APP_PACKAGE
    // T49 (task 6) — release signing. The keystore + credentials come from the
    // CI environment (GitHub Actions secrets: RELEASE_KEYSTORE_FILE path,
    // RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD) or from
    // a local keystore at TMessagesProj/config/release.keystore. When neither
    // exists the release build produces an UNSIGNED APK instead of failing
    // configuration (fresh-clone / local-javac-gate friendly).
    def releaseKeystorePath = System.getenv("RELEASE_KEYSTORE_FILE") ?: "../TMessagesProj/config/release.keystore"
    def hasReleaseCredentials = file(releaseKeystorePath).exists() && System.getenv("RELEASE_STORE_PASSWORD") != null

    signingConfigs {
        if (hasReleaseCredentials) {
            hermesRelease {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "hermes"
                keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: System.getenv("RELEASE_STORE_PASSWORD")
                // T64 (install-failure audit): pin ALL signing schemes explicitly.
                // v1 (JAR)  — needed by package loaders on Android < 7 (minSdk 19).
                // v2        — mandatory on Android 11+ for targetSdk >= 30 apps
                //             (INSTALL_PARSE_FAILED_NO_CERTIFICATES otherwise).
                // v3        — same key today; pre-arms future key rotation.
                // The CI build.yml gate enforces v1+v2+cert-pin on every artifact.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    sourceSets.main.jniLibs.srcDirs = ['../TMessagesProj/jni/']

    lint {
        disable += ['MissingTranslation', 'ExtraTranslation', 'BlockedPrivateApi']
        checkReleaseBuilds = false
    }

    // T65: dexOptions was removed in AGP 8 (jumboMode is always on).

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            applicationIdSuffix ".beta"
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        standalone {
            debuggable false
            jniDebuggable false
            applicationIdSuffix ".web"
            minifyEnabled true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        release {
            debuggable false
            jniDebuggable false
            // T49 (task 6): minification stays OFF for this first release —
            // R8 has never run over the fork's REST layer (TL serializers,
            // reflection-sensitive paths) and a stripped-class runtime crash
            // would be undetectable in CI. Re-enable after a soak test with
            // proguard rules for org/telegram/tgnet/rest/**.
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
            if (hasReleaseCredentials) {
                signingConfig signingConfigs.hermesRelease
            }
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest.xml'
    }

    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    sourceSets.release {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        bundleAfat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            ext {
                abiVersionCode = 1
            }
        }
        bundleAfat_SDK23 {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            minSdk 23
            ext {
                abiVersionCode = 2
            }
        }
        afat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
            ext {
                abiVersionCode = 9
            }
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app.apk"
            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdk 19
        targetSdk 35
        versionName APP_VERSION_NAME
        ndkVersion "21.4.7075529"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                // T65: AGP 8 enforces a minimum CMake of 3.22.1.
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-16' // T53: -j=16 rejected by AGP 7.4 cmake configure; AGP manages build parallelism
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    lint {
        checkReleaseBuilds = false
    }
}